<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realm Forge</title>
    <style>
      body { margin: 0; background: #14181f; color: #e8e2d4; font-family: Georgia, serif; }
      .wrap { max-width: 1600px; margin: 0 auto; }
      /* The ruler card floats over the map's right edge, just below the year counter. */
      .map-box { position: relative; }
      #ruler-card { position: absolute; top: 9%; right: 12px; pointer-events: none; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.6)); }
      #ruler-card canvas { display: block; height: auto; }
      #map { display: block; width: 100%; height: auto; }
      .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; }
      .bar .spacer { flex: 1; }
      button, .bar input[type="text"], .bar select {
        font: 13px system-ui, sans-serif; padding: 5px 12px; border-radius: 4px;
        border: 1px solid #4a5160; background: #232a35; color: #e8e2d4;
      }
      button { cursor: pointer; }
      button:hover { background: #2e3644; }
      button.active { background: #c9b26b; color: #1b1b1b; border-color: #c9b26b; }
      button.recording { background: #b8322b; border-color: #b8322b; }
      .bar input[type="text"] { width: 140px; cursor: text; }
      #info { padding: 0 12px 8px; font: 13px/1.4 system-ui, sans-serif; color: #b9b3a5; min-height: 1.4em; }

      #settings { margin: 0 12px 8px; font: 13px system-ui, sans-serif; }
      #settings summary { cursor: pointer; color: #c9b26b; padding: 4px 0; }
      .settings-row { display: flex; gap: 16px; padding: 6px 0; }
      .settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; margin: 6px 0; }
      .settings-grid fieldset { border: 1px solid #2c3340; border-radius: 4px; }
      .settings-grid legend { color: #c9b26b; padding: 0 4px; }
      .param { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; font: 12px ui-monospace, monospace; }
      .param input { width: 80px; background: #1b2029; color: #e8e2d4; border: 1px solid #3a4150; border-radius: 3px; }
      .param input.changed { border-color: #c9b26b; color: #f3dd90; }

      #log-filters { font: 12px system-ui, sans-serif; color: #b9b3a5; display: flex; flex-wrap: wrap; gap: 12px; padding: 4px 12px; border-top: 1px solid #2c3340; }
      #log {
        margin-bottom: 16px; padding: 4px 12px; height: 180px; overflow-y: auto;
        font: 13px/1.6 system-ui, sans-serif; color: #d8d2c4;
      }
      #log .event { cursor: pointer; }
      #log .event:hover { background: #1f2530; }
      #log .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; }
      #log .event-rebellion { color: #e8c37a; }
      #log .event-collapse, #log .event-annexed { color: #d99a8f; }
      #log .event-war { color: #ef8a80; }
      #log .event-peace { color: #9fc7a3; }
      #log.hide-war .event-war, #log.hide-peace .event-peace, #log.hide-rebellion .event-rebellion,
      #log.hide-founded .event-founded, #log.hide-collapse .event-collapse, #log.hide-annexed .event-annexed,
      #log.hide-capital_moved .event-capital_moved, #log.hide-alliance .event-alliance,
      #log.hide-alliance_ended .event-alliance_ended, #log.hide-city_founded .event-city_founded,
      #log.hide-battle .event-battle, #log.hide-faith .event-faith { display: none; }

      /* Side panel (M16 War Room): beside the map on wide screens, below it on narrow ones. */
      #panel { border-top: 1px solid #2c3340; display: flex; flex-direction: column; }
      .tabs { display: flex; gap: 4px; padding: 8px 12px 0; border-bottom: 1px solid #2c3340; }
      .tabs button { border-radius: 4px 4px 0 0; border-bottom: none; }
      .tab { display: none; height: 420px; overflow-y: auto; }
      .tab.shown { display: block; }
      #tab-log.shown { display: flex; flex-direction: column; }
      #tab-log #log { flex: 1; height: auto; margin-bottom: 0; }
      @media (min-width: 1200px) {
        .wrap { max-width: 2000px; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
        #panel { border-top: none; border-left: 1px solid #2c3340; position: sticky; top: 0; height: 100vh; }
        .tab { height: auto; flex: 1; }
      }

      .wars-empty, .room-note { padding: 12px; font: 13px/1.5 system-ui, sans-serif; color: #8f8a7e; }
      .room-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; font: 13px system-ui, sans-serif; color: #c9b26b; border-bottom: 1px solid #2c3340; }
      .war-row { padding: 8px 12px; border-bottom: 1px solid #222833; cursor: pointer; font: 13px/1.45 system-ui, sans-serif; }
      .war-row:hover { background: #1f2530; }
      .war-row.followed { background: #2a2a1e; box-shadow: inset 3px 0 0 #c9b26b; }
      .war-sides { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-family: Georgia, serif; font-size: 14px; color: #e8e2d4; }
      .war-sides .vs { color: #8f8a7e; font-size: 12px; }
      .war-sides .allies { color: #8f8a7e; font: 11px system-ui, sans-serif; }
      .war-meta { color: #a9a395; font-size: 12px; }
      .score { position: relative; height: 6px; margin: 6px 0 4px; background: #262c37; border-radius: 3px; overflow: hidden; }
      .score .fill { position: absolute; top: 0; bottom: 0; }
      .score .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: #8f8a7e; }
      .war-numbers { display: flex; justify-content: space-between; color: #a9a395; font-size: 12px; }
      .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; }
      .sort { display: flex; gap: 4px; padding: 8px 12px; flex-wrap: wrap; }
      .sort button { font-size: 12px; padding: 3px 8px; }
      .report { padding: 10px 14px 16px; font: 13px/1.55 system-ui, sans-serif; color: #d8d2c4; }
      .report h3 { margin: 4px 0 2px; font: 18px Georgia, serif; color: #e8e2d4; }
      .report .years { color: #a9a395; margin-bottom: 8px; }
      .report dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 8px 0; }
      .report dt { color: #8f8a7e; }
      .report dd { margin: 0; }
      .report h4 { margin: 12px 0 4px; font: 600 12px system-ui, sans-serif; color: #c9b26b; text-transform: uppercase; letter-spacing: 0.06em; }
      .report ul { margin: 0; padding-left: 18px; }
      .sandbox-part { padding: 8px 12px 12px; border-bottom: 1px solid #222833; font: 13px/1.5 system-ui, sans-serif; color: #d8d2c4; }
      .sandbox-part h4 { margin: 4px 0 6px; font: 600 12px system-ui, sans-serif; color: #c9b26b; text-transform: uppercase; letter-spacing: 0.06em; }
      .sandbox-field { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; color: #a9a395; }
      .sandbox-field select, .sandbox-field input { width: 200px; background: #1b2029; color: #e8e2d4; border: 1px solid #3a4150; border-radius: 3px; padding: 2px 4px; }
      .sandbox-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
      .sandbox-row button:disabled { opacity: 0.4; cursor: not-allowed; }
      .sandbox-row progress { flex: 1; }
      .sandbox-note { min-height: 1.5em; margin-top: 4px; color: #a9a395; font-size: 12px; }
      .sandbox-odds p { margin: 6px 0; }
      .sandbox-odds p:last-child { color: #8f8a7e; font-size: 12px; }
      .report svg { display: block; width: 100%; height: 60px; background: #1b2029; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <main>
        <div class="map-box">
          <canvas id="map"></canvas>
          <div id="ruler-card" hidden></div>
        </div>
        <div id="bar" class="bar"></div>
        <div id="info">Hover the map to inspect a cell and see its ruler · Space play/pause · → step · C cells · N nations · R races · A alliances · M resources · T towns · H heatmaps · E effects · W armies · P ruler card · click an event to highlight it, or a war to follow it</div>
        <details id="settings"><summary>Settings</summary></details>
      </main>
      <aside id="panel">
        <nav class="tabs">
          <button data-tab="wars">Wars</button>
          <button data-tab="past">Past wars</button>
          <button data-tab="log">Log</button>
          <button data-tab="sandbox" title="God powers over wars, and the odds of what happens next">Sandbox</button>
        </nav>
        <section id="tab-wars" class="tab"></section>
        <section id="tab-past" class="tab"></section>
        <section id="tab-log" class="tab">
          <div id="log-filters"></div>
          <div id="log"></div>
        </section>
        <section id="tab-sandbox" class="tab"></section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
